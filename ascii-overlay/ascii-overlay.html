<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b09">
  <title>ASCII Overlay Preview</title>
  <link rel="stylesheet" href="ascii-overlay.css">
</head>
<body class="asov_preview">
<main class="asov_stage" aria-label="Animated ASCII photo overlay">
<div
  class="asov_container"
  data-anm-ascii-overlay
  data-anm-image="https://annnimate.b-cdn.net/preview-assets/vanta/hero_cycling_02.jpg?width=1920"
  data-anm-cell-size="8"
  data-anm-glyphs="1,x,0,X,*,#,@"
  data-anm-thresh-low="0.32"
  data-anm-thresh-high="0.7"
  data-anm-whitening="0.7"
  data-anm-opacity="0.9"
  data-anm-jitter="0.35"
  data-anm-reshuffle-rate="0.6"
  data-anm-detail-thresh="0.1"
  data-anm-detail-strength="1"
  data-anm-char-gap="0.3"
></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="ascii-overlay.js"></script>
</body>
</html>
