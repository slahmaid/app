<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#dbe5c8" />
    <title>chlah. | Move with intention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="multi-level-drawer-menu/multi-level-drawer-menu.css" />
    <link rel="stylesheet" href="curtain-slider/curtain-slider.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main
      class="mldm_wrap"
      id="top"
      data-anm-multi-level-drawer-menu
      data-anm-duration="0.9"
      data-anm-ease="expo.out"
      data-anm-stagger="0.06"
      data-anm-panel-bg="#f4f3ec"
    >
      <div class="mldm_page" data-anm-mldm-page>
        <div
          class="cs_wrap"
          data-anm-curtain-slider
          data-anm-duration="1.1"
          data-anm-ease="annnimate"
          data-anm-columns="12"
          data-anm-auto="0"
          data-anm-drag="true"
          data-anm-stagger="0.0125"
        >
          <div class="cs_slides" data-anm-cs-slides hidden>
            <div data-anm-cs-slide data-title="Motion" data-label="Chapter 01">
              <img src="https://annnimate.b-cdn.net/preview-assets/vanta/hero_run_02.jpg?width=1920&amp;format=auto" alt="Runner silhouetted mid-stride against a bright wall" />
            </div>
            <div data-anm-cs-slide data-title="Endure" data-label="Chapter 02">
              <img src="https://annnimate.b-cdn.net/preview-assets/vanta/action_cyclist-climb_02.jpg?width=1920&amp;format=auto" alt="Cyclist climbing in motion blur against a warm backdrop" />
            </div>
            <div data-anm-cs-slide data-title="Focus" data-label="Chapter 03">
              <img src="https://annnimate.b-cdn.net/preview-assets/vanta/hero_profile_02.jpg?width=1920&amp;format=auto" alt="Athlete in profile against a bright orange field" />
            </div>
          </div>
          <div class="cs_stage" data-anm-cs-stage></div>
        </div>
      </div>

      <header class="nimo_header" aria-label="Site header">
        <a class="mldm_logo" data-anm-mldm-logo href="#top" aria-label="chlah home">chlah.</a>
        <button
          class="mldm_toggle"
          data-anm-mldm-toggle
          aria-expanded="false"
          aria-controls="mldm_overlay"
          aria-label="Open navigation menu"
        >
          <span class="mldm_toggle_label_wrap">
            <span class="mldm_toggle_label_track" data-anm-mldm-label-track>
              <span class="mldm_toggle_label mldm_toggle_label_open" data-anm-mldm-label-open>Menu</span>
              <span class="mldm_toggle_label mldm_toggle_label_close">Close</span>
            </span>
          </span>
          <span class="mldm_toggle_icon" aria-hidden="true">
            <span class="mldm_toggle_line mldm_toggle_line_top" data-anm-mldm-icon-top></span>
            <span class="mldm_toggle_line mldm_toggle_line_bottom" data-anm-mldm-icon-bottom></span>
          </span>
        </button>
      </header>

      <div
        class="mldm_overlay"
        id="mldm_overlay"
        data-anm-mldm-overlay
        role="dialog"
        aria-modal="true"
        aria-label="Navigation"
        aria-hidden="true"
        inert
      >
        <button class="mldm_scrim" data-anm-mldm-scrim aria-label="Close menu" tabindex="-1"></button>

        <aside class="mldm_panel mldm_panel_primary" data-anm-mldm-panel data-anm-mldm-panel-level="1">
          <div class="mldm_panel_inner">
            <nav class="mldm_primary_nav" aria-label="Shop categories">
              <ul class="mldm_list">
                <li class="mldm_item"><button class="mldm_primary" data-anm-mldm-primary data-anm-mldm-target="activewear" aria-expanded="false"><span class="mldm_primary_dot" aria-hidden="true"></span><span class="mldm_primary_label">Activewear</span></button></li>
                <li class="mldm_item"><button class="mldm_primary" data-anm-mldm-primary data-anm-mldm-target="everyday" aria-expanded="false"><span class="mldm_primary_dot" aria-hidden="true"></span><span class="mldm_primary_label">Everyday</span></button></li>
                <li class="mldm_item"><button class="mldm_primary" data-anm-mldm-primary data-anm-mldm-target="footwear" aria-expanded="false"><span class="mldm_primary_dot" aria-hidden="true"></span><span class="mldm_primary_label">Footwear</span></button></li>
                <li class="mldm_item"><button class="mldm_primary" data-anm-mldm-primary data-anm-mldm-target="accessories" aria-expanded="false"><span class="mldm_primary_dot" aria-hidden="true"></span><span class="mldm_primary_label">Accessories</span></button></li>
              </ul>
              <a class="mldm_explore" data-anm-mldm-secondary href="#collection">Explore all</a>
            </nav>

            <div class="mldm_cards">
              <a class="mldm_card" data-anm-mldm-secondary href="#journal">
                <span class="mldm_card_media"><img class="mldm_card_img" src="https://annnimate.b-cdn.net/preview-assets/images/sports/running-hero-female-1.avif" alt="Runner wearing chlah-inspired activewear" /></span>
                <span class="mldm_card_label">Field notes</span>
              </a>
              <a class="mldm_card" data-anm-mldm-secondary href="#community">
                <span class="mldm_card_media"><img class="mldm_card_img" src="https://annnimate.b-cdn.net/preview-assets/images/sports/street-running-earbuds-3.avif" alt="City running essentials" /></span>
                <span class="mldm_card_label">Community</span>
              </a>
            </div>

            <nav class="mldm_footer_nav" aria-label="More links">
              <a class="mldm_footer_link" data-anm-mldm-secondary href="#about">About chlah</a>
              <a class="mldm_footer_link" data-anm-mldm-secondary href="#journal">Journal</a>
            </nav>
          </div>
        </aside>

        <aside class="mldm_panel mldm_panel_secondary" data-anm-mldm-panel data-anm-mldm-panel-level="2" aria-label="Category links">
          <button class="mldm_back" data-anm-mldm-back aria-label="Back to shop categories">
            <span class="mldm_back_icon" aria-hidden="true"></span><span class="mldm_back_label">Back</span>
          </button>
          <div class="mldm_panel_inner">
            <div class="mldm_sublist_stack" data-anm-mldm-sublist-stack>
              <div class="mldm_sublist mldm_sublist_active" data-anm-mldm-sublist data-anm-mldm-sublist-for="activewear" aria-hidden="false">
                <ul class="mldm_list">
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Tops</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Leggings</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Shorts</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Layers</span></button></li>
                </ul>
              </div>
              <div class="mldm_sublist" data-anm-mldm-sublist data-anm-mldm-sublist-for="everyday" aria-hidden="true">
                <ul class="mldm_list">
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Tees</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Sweats</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Trousers</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Outerwear</span></button></li>
                </ul>
              </div>
              <div class="mldm_sublist" data-anm-mldm-sublist data-anm-mldm-sublist-for="footwear" aria-hidden="true">
                <ul class="mldm_list">
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Running</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Training</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Everyday</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">All footwear</span></button></li>
                </ul>
              </div>
              <div class="mldm_sublist" data-anm-mldm-sublist data-anm-mldm-sublist-for="accessories" aria-hidden="true">
                <ul class="mldm_list">
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Bags</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Socks</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Caps</span></button></li>
                  <li class="mldm_item"><button class="mldm_sublink" data-anm-mldm-secondary-link><span class="mldm_sublink_dot" aria-hidden="true"></span><span class="mldm_sublink_label">Equipment</span></button></li>
                </ul>
              </div>
            </div>
            <a class="mldm_sub_explore" data-anm-mldm-secondary href="#collection">Explore this category</a>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="curtain-slider/curtain-slider.js"></script>
    <script src="multi-level-drawer-menu/multi-level-drawer-menu.js"></script>
  </body>
</html>
